<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Opening…</title>
<style>
  :root{color-scheme:light dark;--bg:#fafaf7;--ink:#1d1d1b;--muted:#6b6b66;--accent:#2f5d8a}
  @media (prefers-color-scheme:dark){:root{--bg:#141413;--ink:#ecebe6;--muted:#9a9993;--accent:#8fb6dd}}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,system-ui,sans-serif}
  main{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:0 16px;text-align:center}
  a{display:inline-block;padding:10px 18px;border-radius:10px;background:var(--accent);color:var(--bg);text-decoration:none;font-weight:600}
  p{margin:0;color:var(--muted);font-size:.9rem}
</style>
</head>
<body>
<main>
  <a id="go" hidden>Open</a>
  <p id="msg">Opening…</p>
</main>
<script>
  // Redirects https://…/#<encoded target> to an obsidian:// or message:// link.
  // The target rides in the #fragment, which browsers never send to the server.
  (function () {
    var go = document.getElementById("go"), msg = document.getElementById("msg"), t = "";
    try { t = decodeURIComponent(location.hash.slice(1)); } catch (e) {}
    var m = /^(obsidian|message):/i.exec(t);
    if (!m) { msg.textContent = "Not a supported link."; return; }
    go.href = t;
    go.textContent = m[1].toLowerCase() === "obsidian" ? "Open in Obsidian" : "Open in Mail";
    go.hidden = false;
    msg.textContent = "If nothing happens, tap the button.";
    location.replace(t);
  })();
</script>
</body>
</html>
