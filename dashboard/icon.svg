<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#357c69"/>
      <stop offset="1" stop-color="#1f5244"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#0b2620" flood-opacity=".35"/>
    </filter>
    <clipPath id="card"><rect x="232" y="252" width="560" height="540" rx="72"/></clipPath>
  </defs>
  <!-- full-bleed background: no transparency, safe for maskable -->
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <g transform="translate(512 512) scale(1.15) translate(-512 -522)">
  <!-- calendar page -->
  <g filter="url(#sh)">
    <rect x="232" y="252" width="560" height="540" rx="72" fill="#ffffff"/>
  </g>
  <g clip-path="url(#card)">
    <rect x="232" y="252" width="560" height="138" fill="#f5cf9f"/>
    <!-- sun in the header -->
    <circle cx="512" cy="321" r="36" fill="#e5860a"/>
  </g>
  <!-- binder rings -->
  <rect x="345" y="214" width="34" height="86" rx="17" fill="#1b2220"/>
  <rect x="645" y="214" width="34" height="86" rx="17" fill="#1b2220"/>
  <!-- day timeline: swim, event, bike -->
  <rect x="300" y="448" width="230" height="64" rx="32" fill="#2b78b5"/>
  <rect x="380" y="558" width="330" height="64" rx="32" fill="#2f3878"/>
  <rect x="300" y="668" width="290" height="64" rx="32" fill="#c2611b"/>
  <!-- "now" marker -->
  <rect x="610" y="428" width="12" height="324" rx="6" fill="#d1453b"/>
  <circle cx="616" cy="428" r="22" fill="#d1453b"/>
  </g>
</svg>
